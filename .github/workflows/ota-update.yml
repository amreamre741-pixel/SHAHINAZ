name: SHAHINAZ Auto OTA Update

on:
  push:
    branches: [main]
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "src/**"
      - "assets/**"
  workflow_dispatch:

jobs:
  publish-ota:
    name: Publish Instant OTA Update (EAS Update)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check EXPO_TOKEN secret
        id: check_token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "EXPO_TOKEN secret is not configured yet. Skipping automatic EAS OTA publish."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Expo & EAS CLI
        if: steps.check_token.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        if: steps.check_token.outputs.has_token == 'true'
        run: npm ci || npm install

      - name: Publish OTA to preview channel
        if: steps.check_token.outputs.has_token == 'true'
        run: eas update --branch preview --message "Auto OTA: ${{ github.event.head_commit.message || 'SHAHINAZ Update' }}" --non-interactive

      - name: Publish OTA to production channel
        if: steps.check_token.outputs.has_token == 'true'
        run: eas update --branch production --message "Auto OTA: ${{ github.event.head_commit.message || 'SHAHINAZ Update' }}" --non-interactive
